[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "etims"
dynamic = ["version"]
description = "Open-source Python client for KRA eTIMS (OSCU): register items and sign invoices and credit notes directly with the Kenya Revenue Authority."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MutaiT" }]
keywords = ["kra", "etims", "oscu", "kenya", "vat", "tax", "invoicing", "fiscal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
# Only `requests`, which Odoo, Django and most Python stacks already ship.
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/MutaiT/etims"
Issues = "https://github.com/MutaiT/etims/issues"
Changelog = "https://github.com/MutaiT/etims/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.25",
]

[tool.hatch.version]
path = "src/etims/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/etims"]

[tool.hatch.build.targets.sdist]
include = ["src/etims", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: calls the real KRA sandbox; needs credentials in .env (run with -m live)"]

[tool.coverage.run]
source = ["etims"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "RET"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
